name: Claude Code

# A caller of the shared @claude mention workflow in datacrew-space/ci-workflows, pinned to a commit
# SHA (docs: docs/claude-mention.md in that repository). The caller owns the triggers: these four are
# every event that can summon Claude. Do not add `pull_request_target`: the job holds the Claude token.
# Add `assigned` to the `issues` types only if an issue assigned with the phrase in it should count.
#
# The job checks the phrase and the author itself and ends green without calling Claude otherwise, so
# a green run does not prove this works: the check is a real reply to an `@claude` mention.
#
# PUBLIC repo: never set the repository variable CI_RUNS_ON to a self-hosted runner. A fork PR would
# run its own code on those machines; GitHub-hosted runners are free here.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    uses: datacrew-space/ci-workflows/.github/workflows/claude-mention.yml@f838ff0adefdfcfa4924c9f092d23348aff7b8c5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    with:
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      infisical-domain: "https://infisical.datacrew.space"
      infisical-project-slug: "hostinger_vps"
      # infisical-env-slug: prod
      # infisical-claude-path: /claude
      # trigger-phrase: "@claude"
      # allowed-associations: "OWNER,MEMBER,COLLABORATOR"
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
