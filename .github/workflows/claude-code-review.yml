name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# A review of a superseded head is wasted tokens; review only the latest push.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}

    # PUBLIC repo — keep CI_RUNS_ON unset or GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Claude Code OAuth token from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: "https://infisical.datacrew.space"
          project-slug: "hostinger_vps"
          env-slug: "prod"
          secret-path: "/claude"

      # continue-on-error so a tooling failure (usage limit, auth, action startup)
      # cannot turn the PR red; the next step decides whether it was tooling or a
      # real review error. Keep this workflow non-required in branch protection.
      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Classify a failed action step with .github/scripts/classify-claude-review.sh
      # (tests: .github/scripts/tests/test-classify-claude-review.sh). Tooling means
      # the result is is_error, <= 1 turn and $0 (observed 2026-10-14..18). A missing
      # execution file stays RED: it can't be told apart from permanent misconfiguration
      # (bad prompt, plugin marketplace, bot actor), and hiding that is worse than a red
      # non-required check. Infisical fetch failure is a separate step and stays red.
      - name: Classify claude-review outcome
        if: ${{ always() && steps.claude-review.outcome == 'failure' }}
        env:
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if kind=$(bash .github/scripts/classify-claude-review.sh "${EXEC_FILE}"); then
            echo "::warning title=claude-review skipped::tooling failure ($kind); not a review result"
            echo "claude-review skipped: tooling failure ($kind); not a review result" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::claude-review failed: real review error or no execution file (see the action step log)"
          exit 1
